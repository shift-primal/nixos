# Recipients for each encrypted file under secrets/. Public keys only.
#
# A host's key:  ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub   (on that host)
#            or  ssh-keyscan -t ed25519 <host> | ssh-to-age
# Your key:      age-keygen (keep the private half in Bitwarden, not on disk)
#
# After adding a recipient, re-encrypt the files it should read:
#   sops updatekeys secrets/<file>.yaml
# Create or edit a file with: sops secrets/<file>.yaml
#
# Every rule lists &kasper so you can always edit every file. Host keys are added as each
# machine gets one; until a host is listed, it can't decrypt its file.

keys:
  - &kasper age1lxdh5j807xs3dvsszpmr5j3vrxlf5hnr4uq3zrpnepzwjme90fgsl7gnqh
  # - &user age1...                  # Home Manager's key, ~/.config/sops/age/keys.txt
  # - &kash-desktop age1...
  # - &kash-laptop age1...
  - &kash-homelab age16vyf34m2057znggjvewu3spak6su3n2hych4x6ra6fkzk93tmejsr5evdt

creation_rules:
  # One host + you. The host's default file (modules/secrets/sops.nix).
  - path_regex: secrets/hosts/kash-desktop\.yaml$
    key_groups: [{ age: [*kasper] }] # + *kash-desktop
  - path_regex: secrets/hosts/kash-laptop\.yaml$
    key_groups: [{ age: [*kasper] }] # + *kash-laptop
  - path_regex: secrets/hosts/kash-homelab\.yaml$
    key_groups: [{ age: [*kasper, *kash-homelab] }]
  # Every host.
  - path_regex: secrets/common\.yaml$
    key_groups: [{ age: [*kasper] }] # + every host key
  # Home Manager (user-level) secrets.
  - path_regex: secrets/home\.yaml$
    key_groups: [{ age: [*kasper] }] # + *user
