# Recipients for each encrypted file under secrets/. Public keys only.
#
# A host's key:  ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub   (on that host)
#            or  ssh-keyscan -t ed25519 <host> | ssh-to-age
# Your key:      age-keygen (keep the private half in Bitwarden, not on disk)
#
# After adding a recipient, re-encrypt the files it should read:
#   sops updatekeys secrets/<file>.yaml
# Create or edit a file with: sops secrets/<file>.yaml
#
# Fill in the keys and uncomment. Every file also lists &kasper so you can always edit it.
#
# keys:
#   - &kasper age1...
#   - &user age1...                  # Home Manager's key, ~/.config/sops/age/keys.txt
#   - &kash-desktop-nixos age1...
#   - &kash-laptop-nixos age1...
#
# creation_rules:
#   # One host + you. The host's default file (modules/secrets/sops.nix).
#   - path_regex: secrets/hosts/kash-desktop-nixos\.yaml$
#     key_groups: [{ age: [*kasper, *kash-desktop-nixos] }]
#   - path_regex: secrets/hosts/kash-laptop-nixos\.yaml$
#     key_groups: [{ age: [*kasper, *kash-laptop-nixos] }]
#   # Every host.
#   - path_regex: secrets/common\.yaml$
#     key_groups: [{ age: [*kasper, *kash-desktop-nixos, *kash-laptop-nixos] }]
#   # Home Manager (user-level) secrets.
#   - path_regex: secrets/home\.yaml$
#     key_groups: [{ age: [*kasper, *user] }]
