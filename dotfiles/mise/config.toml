[tools]
node = "lts"
pnpm = "latest"
python = "latest"
uv = "latest"
go = "latest"
rust = { version = "stable", components = "rust-analyzer,clippy,rustfmt" }
ruff = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"github:clangd/clangd" = "latest"
"npm:oxlint" = "latest"
"npm:@biomejs/biome" = "latest"
"npm:typescript" = "latest"
"npm:@astrojs/language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"npm:pyright" = "latest"
"npm:prettier" = "latest"
"github:redhat-developer/vscode-xml" = { version = "latest", asset_pattern = "lemminx-linux-x86_64.zip", bin = "lemminx" }

[settings]
node.compile = false
python.compile = false
