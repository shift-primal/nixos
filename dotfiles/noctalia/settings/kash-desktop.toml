config_version = 20

[bar.default]
background_opacity = 0.99999997764825821
border = "on_surface"
capsule_fill = "hover"
capsule_radius = "auto"
center = [ "workspaces" ]
compositor_blur = false
concave_edge_corners = false
contact_shadow = true
end = [ "media", "group:dev", "group:g3", "group:g5", "group:g1", "group:g2" ]
font_family = "Monaspace Neon NF"
font_weight = 600
padding = 16
panel_overlap = 0
start = [ "session", "group:g6", "group:g4" ]
thickness = 40
widget_spacing = 16

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "dev"
    members = [ "raycursive/github-prs:bar", "8bury/mini-docker:mini-docker" ]
    opacity = 1.0
    padding = 8.0
    widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g2"
    members = [ "notifications", "clock", "tray" ]
    opacity = 1.0
    padding = 6.0
    radius = 80.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g3"
    members = [ "recorder", "clipboard", "gamaraan/mx-control:mx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g5"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0
    radius = 80.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g4"
    members = [ "wallhaven", "wallpaper" ]
    opacity = 1.0
    padding = 6.0
    radius = 80.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g6"
    members = [ "bar", "mindnbytes/nix-status:status", "summary" ]
    opacity = 1.0
    padding = 6.0
    radius = 80.0

