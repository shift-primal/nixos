[notification]
background_opacity = 0.99999997764825821

[osd]
background_opacity = 0.99999997764825821

[plugin_settings."mindnbytes/nix-status"]
flake_dir = "/home/kasper/nixos"
nixos_configuration = "kash-desktop"
use_themed_logos = true

[plugins]
enabled = [
    "noctalia/bitwarden",
    "gamaraan/mx-control",
    "raycursive/github-prs",
    "8bury/mini-docker",
    "cleboost/ssh-launcher",
    "kenn/keybind-cheatsheet",
    "tmelik/system-monitor",
    "alexander/screen-toolkit",
    "nightwatch75/file-search",
    "noctalia/screen_recorder",
    "noctalia/wallhaven",
    "srounce/systemd",
    "lfdominguez/claude-sessions"
]

[shell]
avatar_path = "/home/kasper/Pictures/lash2.png"
font_family = "DejaVu Sans"

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    default_view = "all"
    provider_prefix = ">"

    [shell.panel]
    transparency_mode = "soft"

    [shell.screenshot]
    directory = "/home/kasper/Pictures/screenshots"
    region_dim_opacity = 0.74999998323619366

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "sudo reboot-to windows"
    countdown_seconds = 0.0
    enabled = true
    glyph = "brand-windows-filled"
    label = "Windows"
    shortcut = "w"
    variant = "default"

    [shell.shadow]
    alpha = 0.24999999441206455

[theme]
community_palette = "Gruvbox Material Hard"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "luciole", "qt" ]
    community_ids = [ "claude-code", "discord", "steam", "gruvbox-plus-icons", "hyprtoolkit", "fzf", "lazygit", "yazi" ]

[wallpaper]
directory = "/home/kasper/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/kasper/Pictures/wallpapers/wallhaven-1pd22w.png"

    [wallpaper.last]
    path = "/home/kasper/Pictures/wallpapers/wallhaven-1pd22w.png"

    [wallpaper.monitors.DP-1]
    path = "/home/kasper/Pictures/wallpapers/wallhaven-1pd22w.png"

    [wallpaper.monitors.DP-2]
    path = "/home/kasper/Pictures/wallpapers/wallhaven-1pd22w.png"

    [wallpaper.monitors.DP-3]
    path = "/home/kasper/Pictures/wallpapers/wallhaven-1pd22w.png"

[widget.bar]
type = "lfdominguez/claude-sessions:bar"

[widget.clock]
tooltip_format = "{:%a %d. %b - %y}"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
color = "error"

[widget.summary]
show_cpu_details_in_tooltip = true
show_cpu_temperature = false
show_download = false
show_gpu_temperature = "off"
show_gpu_usage = "on"
show_gpu_vram = "off"
show_swap = false
show_upload = false
type = "tmelik/system-monitor:summary"

[widget.sysmon]
visualization = "graph"

[widget.tray]
drawer = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"