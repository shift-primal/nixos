config_version = 15

[bar.default]
background_opacity = 0.69999998435378075
capsule_radius = 80
capsule_thickness = 0.74999998696148396
contact_shadow = true
end = [ "media", "group:dev", "group:g3", "group:g2", "group:g1", "notifications", "tray", "session" ]
font_family = "Monaspace Neon NF"
font_weight = 600
margin_ends = 0
radius = 0
start = [ "launcher", "wallpaper", "workspaces", "sysmon" ]
thickness = 32
widget_spacing = 12

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border = ""
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "dev"
    members = [
        "nightwatch75/claude-cockpit:widget",
        "raycursive/github-prs:bar",
        "8bury/mini-docker:mini-docker",
        "mindnbytes/nix-status:status"
    ]
    opacity = 1.0
    padding = 8.0
    widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = true
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "clipboard", "gamaraan/mx-control:mx" ]
    opacity = 1.0
    padding = 6.0

