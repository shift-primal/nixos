[plugins]
enabled = [
    "noctalia/bitwarden",
    "nightwatch75/claude-cockpit",
    "mindnbytes/nix-status",
    "gamaraan/mx-control",
    "raycursive/github-prs",
    "8bury/mini-docker",
    "cleboost/ssh-launcher",
    "kenn/keybind-cheatsheet",
    "tmelik/system-monitor",
    "alexander/screen-toolkit"
]

[shell]
font_family = "DejaVu Sans"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "destructive"

    [[shell.session.actions]]
    action = "command"
    command = "sudo reboot-to windows"
    countdown_seconds = 0.0
    enabled = true
    glyph = "brand-windows-filled"
    label = "Windows"
    shortcut = "w"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "sudo reboot-to arch"
    countdown_seconds = 0.0
    enabled = true
    glyph = "building-arch"
    label = "Arch"
    shortcut = "a"
    variant = "default"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"

[wallpaper]
directory = "/home/kasper/Pictures/wallpapers-converted"

    [wallpaper.default]
    path = "/home/kasper/Pictures/wallpapers-converted/nix-1.png"

    [wallpaper.last]
    path = "/home/kasper/Pictures/wallpapers-converted/nix-1.png"

    [wallpaper.monitors.DP-1]
    path = "/home/kasper/Pictures/wallpapers-converted/nix-1.png"

    [wallpaper.monitors.DP-2]
    path = "/home/kasper/Pictures/wallpapers-converted/nix-1.png"

    [wallpaper.monitors.DP-3]
    path = "/home/kasper/Pictures/wallpapers-converted/nix-1.png"

[widget.clock]
tooltip_format = "{:%a %d. %b - %y}"

[widget.tray]
drawer = true