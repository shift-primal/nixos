enable_audio_bell no
font_size 12.0
window_padding_width 25
cursor_trail 1
confirm_os_window_close 0
cursor_shape block
shell_integration no-cursor
disable_ligatures never

tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

remember_window_size no

map ctrl+insert copy_to_clipboard



# BEGIN_KITTY_FONTS
font_family      family="Monaspace Neon NF"
font_features    MonaspaceNeonNF-Regular -calt +liga +ss01 +ss02 +ss03 -ss04 +ss09
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# font_features only applies to the face it names, so without these the bold and italic faces
# keep calt (texture healing) and squeeze letters like w. bold_font auto picks SemiBold, not Bold
# (check with `kitty --debug-font-fallback`). Outside the block above because
# `kitten choose-fonts` rewrites it.
font_features    MonaspaceNeonNF-SemiBold -calt +liga +ss01 +ss02 +ss03 -ss04 +ss09
font_features    MonaspaceNeonNF-Italic -calt +liga +ss01 +ss02 +ss03 -ss04 +ss09
font_features    MonaspaceNeonNF-SemiBoldItalic -calt +liga +ss01 +ss02 +ss03 -ss04 +ss09
# BETWEEN
include themes/noctalia.conf
